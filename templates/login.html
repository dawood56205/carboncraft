{% extends "layout.html" %}

{% block content %}
<h2 class="text-white text-4xl font-bold text-center m-5">Login</h2>
  <form class="text-white bg-gray-900 w-100 m-auto p-20 rounded-2xl" method="post">

    {% csrf_token %}
    {{form.as_p}}
    <button class="bg-blue-600 p-2 rounded mt-5 w-[100%]">Login</button>

  </form>
  <p class="text-white text-center mt-10">Don't have an account? <a class="text-blue-600" href="{% url 'register' %}">register here</a></p>

{% endblock %}
