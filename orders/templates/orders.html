{% extends "base.html" %}
{% block content %}

<section class="max-w-2xl mx-auto py-12 px-6 bg-[#050505]">
  <div class="mb-10 text-center space-y-2">
      <h2 class="text-[10px] uppercase tracking-[0.5em] font-black text-red-600">Checkout Protocol</h2>
      <h1 class="text-4xl font-black italic tracking-tighter text-white uppercase">
          COMPLETE <span class="text-white/40">ACQUISITION</span>
      </h1>
  </div>

  <form method="POST" class="space-y-8">
      {% csrf_token %}

      <div class="p-6 bg-white/[0.02] border border-white/10 rounded-[2rem] backdrop-blur-3xl flex items-center justify-between gap-6">
          <div class="flex items-center gap-6">
              <div class="relative w-20 h-20 bg-black rounded-2xl border border-white/10 overflow-hidden p-2 group">
                  <img src="{{product.photo.url}}" alt="{{product.product}}" class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500">
              </div>
              <div>
                  <h3 class="text-sm font-black text-white uppercase tracking-tight italic">{{product.product}}</h3>
                  <div class="flex items-center gap-3 mt-2">
                      <label class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Qty</label>
                      <input type="number" name="quantity" id="qty-input" value="1" min="1" 
                          class="w-16 px-2 py-1 bg-black/50 border border-white/5 rounded-lg text-white text-xs text-center focus:border-red-600 outline-none transition-all">
                  </div>
              </div>
          </div>
          <div class="text-right">
              <p class="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-1">Total Valuation</p>
              <span id="total-price-display" class="text-xl font-black text-red-600 italic">Rs. {{product.price}}</span>
          </div>
      </div>

      <script>
          const qtyInput = document.getElementById('qty-input');
          const priceDisplay = document.getElementById('total-price-display');
          const unitPrice = parseFloat("{{product.price}}");

          qtyInput.addEventListener('input', () => {
              const qty = parseInt(qtyInput.value) || 1;
              const total = (unitPrice * qty).toFixed(2);
              priceDisplay.innerText = `Rs. ${total}`;
          });
      </script>

      <div class="p-8 bg-[#0d0d0d] border border-white/5 rounded-[2.5rem] shadow-2xl space-y-8">
          
          <div class="space-y-5">
              <div class="flex items-center gap-2 mb-2">
                  <div class="w-1.5 h-1.5 bg-red-600 rounded-full"></div>
                  <h2 class="text-[10px] font-black text-white uppercase tracking-[0.3em]">Communication Data</h2>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                  <div class="space-y-1.5">
                      <label class="text-[9px] uppercase tracking-widest font-black text-gray-600 ml-2">Digital Address</label>
                      <input type="email" name="email" placeholder="name@domain.com" required
                          class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/30 outline-none transition-all placeholder:text-gray-800">
                  </div>
                  <div class="space-y-1.5">
                      <label class="text-[9px] uppercase tracking-widest font-black text-gray-600 ml-2">Secure Line (Phone)</label>
                      <input type="text" name="phone" placeholder="+92 XXX XXXXXXX" required
                          class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/30 outline-none transition-all placeholder:text-gray-800">
                  </div>
              </div>
          </div>

          <div class="space-y-5">
              <div class="flex items-center gap-2 mb-2">
                  <div class="w-1.5 h-1.5 bg-red-600 rounded-full"></div>
                  <h2 class="text-[10px] font-black text-white uppercase tracking-[0.3em]">Logistics Protocol</h2>
              </div>
              <div class="grid grid-cols-2 gap-5">
                  <div class="space-y-1.5">
                      <label class="text-[9px] uppercase tracking-widest font-black text-gray-600 ml-2">First Name</label>
                      <input type="text" name="first_name" placeholder="John" required
                          class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/30 outline-none transition-all placeholder:text-gray-800">
                  </div>
                  <div class="space-y-1.5">
                      <label class="text-[9px] uppercase tracking-widest font-black text-gray-600 ml-2">Last Name</label>
                      <input type="text" name="last_name" placeholder="Doe" required
                          class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/30 outline-none transition-all placeholder:text-gray-800">
                  </div>
                  <div class="col-span-2 space-y-1.5">
                      <label class="text-[9px] uppercase tracking-widest font-black text-gray-600 ml-2">Deployment Address</label>
                      <input type="text" name="address" placeholder="Physical Street Address" required
                          class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/30 outline-none transition-all placeholder:text-gray-800">
                  </div>
                  <div class="col-span-2 space-y-1.5">
                      <label class="text-[9px] uppercase tracking-widest font-black text-gray-600 ml-2">City / Sector</label>
                      <input type="text" name="city" placeholder="E.g. Lahore" required
                          class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/30 outline-none transition-all placeholder:text-gray-800">
                  </div>
              </div>
          </div>

          <button type="submit"
              class="group relative w-full py-5 bg-red-600 hover:bg-red-700 text-white font-black uppercase tracking-[0.3em] text-xs rounded-2xl transition-all shadow-2xl shadow-red-600/20 active:scale-[0.98] overflow-hidden">
              <span class="relative z-10">Execute Acquisition</span>
              <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
          </button>
          
          <p class="text-[8px] text-center text-gray-700 uppercase tracking-widest font-bold">
              Orders are encrypted & verified via CarbonCraft Studio Secure_API v2.0
          </p>
      </div>
  </form>
</section>

{% endblock %}
