{% extends "base.html" %}
{% block content %}
<section class="max-w-2xl mx-auto py-12 px-6">
  <div class="mb-10 text-center space-y-2">
    <h2 class="text-[10px] uppercase tracking-[0.5em] font-black text-red-600">Booking Protocol</h2>
    <h1 class="text-4xl font-black italic tracking-tighter text-white uppercase">
      INITIALIZE <span class="text-white/40">{{ service.service_name }}</span>
    </h1>
  </div>

  <div class="p-1 bg-white/5 backdrop-blur-3xl rounded-[2.5rem] border border-white/10 shadow-2xl overflow-hidden">
    <form method="POST" class="p-8 space-y-6">
      {% csrf_token %}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="space-y-1.5">
          <label class="text-[9px] uppercase tracking-widest font-black text-gray-500 ml-2">Commander First Name</label>
          <input type="text" name="first_name" placeholder="E.g. Dawood"
            class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/50 outline-none transition-all placeholder:text-gray-700">
        </div>
        <div class="space-y-1.5">
          <label class="text-[9px] uppercase tracking-widest font-black text-gray-500 ml-2">Last Name</label>
          <input type="text" name="last_name" placeholder="Enter Surname"
            class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/50 outline-none transition-all placeholder:text-gray-700">
        </div>
      </div>

      <div class="space-y-5">
        <div class="space-y-1.5">
          <label class="text-[9px] uppercase tracking-widest font-black text-gray-500 ml-2">Digital Address (Email)</label>
          <input type="email" name="email" placeholder="name@domain.com"
            class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/50 outline-none transition-all placeholder:text-gray-700">
        </div>
        <div class="space-y-1.5">
          <label class="text-[9px] uppercase tracking-widest font-black text-gray-500 ml-2">Communication Line (Phone)</label>
          <input type="text" name="phone" placeholder="+92 XXX XXXXXXX"
            class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/50 outline-none transition-all placeholder:text-gray-700">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="space-y-1.5">
          <label class="text-[9px] uppercase tracking-widest font-black text-gray-500 ml-2">Deployment Date</label>
          <input required type="date" name="booking_date"
            class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/50 outline-none transition-all [color-scheme:dark]">
        </div>
        <div class="space-y-1.5">
          <label class="text-[9px] uppercase tracking-widest font-black text-gray-500 ml-2">Time Slot</label>
          <input required type="time" name="booking_time" 
            class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/50 outline-none transition-all [color-scheme:dark]">
        </div>
      </div>
      <div class="space-y-1.5">
        <label class="text-[9px] uppercase tracking-widest font-black text-gray-500 ml-2">Physical Coordinates (Address)</label>
        <textarea required name="address" rows="2" placeholder="Street, Area, City"
          class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/50 outline-none transition-all placeholder:text-gray-700 resize-none"></textarea>
      </div>
      <div class="space-y-1.5">
        <label class="text-[9px] uppercase tracking-widest font-black text-gray-500 ml-2">Asset Details (Make, Model, Variant)</label>
        <textarea name="notes" rows="2" placeholder="e.g. Honda City i-DSI 2008"
          class="w-full px-5 py-4 rounded-2xl bg-black/50 border border-white/5 text-white text-sm focus:border-red-600 focus:ring-1 focus:ring-red-600/50 outline-none transition-all placeholder:text-gray-700 resize-none"></textarea>
      </div>

      <button type="submit"
        class="group relative w-full py-5 bg-red-600 hover:bg-red-700 text-white font-black uppercase tracking-[0.3em] text-xs rounded-2xl transition-all shadow-2xl shadow-red-600/20 active:scale-[0.98] overflow-hidden">
        <span class="relative z-10">Confirm Session Initiation</span>
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
      </button>

      <p class="text-[8px] text-center text-gray-600 uppercase tracking-widest font-bold">
        By initiating, you agree to the CarbonCraft Studio Privacy Protocol.
      </p>
    </form>
  </div>
</section>
{% endblock %}
