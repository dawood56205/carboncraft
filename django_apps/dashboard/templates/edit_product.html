{% extends "base1.html" %}

{% block content %}
<div class="min-h-screen bg-[#0a0a0a] py-12 px-4 sm:px-6 lg:px-8 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-neutral-900 via-[#0a0a0a] to-[#0a0a0a]">
    <div class="max-w-4xl mx-auto">
        
        <div class="mb-8 flex justify-between items-center">
            <a href="{% url 'admin_dashboard' %}" class="inline-flex items-center text-sm text-neutral-500 hover:text-red-500 transition-colors font-bold uppercase tracking-widest">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Abort Changes
            </a>
            <span class="text-[10px] font-black text-neutral-700 uppercase tracking-[0.3em]">System ID: #{{ product.id }}</span>
        </div>

        <div class="bg-neutral-900/50 backdrop-blur-xl rounded-3xl shadow-2xl border border-neutral-800 overflow-hidden">
            
            <div class="relative h-32 bg-red-600 overflow-hidden">
                <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-neutral-900 to-transparent"></div>
                <div class="absolute bottom-6 left-8">
                    <h2 class="text-3xl font-black text-white tracking-tighter uppercase italic">Modify <span class="text-neutral-300">Asset</span></h2>
                    <p class="text-red-200 text-xs font-medium tracking-widest uppercase opacity-80">Updating: {{ product.product }}</p>
                </div>
            </div>

            <form action="" method="POST" enctype="multipart/form-data" class="p-8 lg:p-12 space-y-8">
                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-6 gap-8">
                    <div class="md:col-span-4 space-y-2">
                        <label class="text-[10px] font-bold text-neutral-500 uppercase tracking-[0.2em] ml-1">Product Designation</label>
                        <input type="text" name="product" value="{{ product.product }}" required
                            class="w-full bg-neutral-800/50 border border-neutral-700/50 rounded-2xl py-4 px-6 text-white focus:ring-2 focus:ring-red-500/50 focus:border-red-500 outline-none transition-all">
                    </div>

                    <div class="md:col-span-2 space-y-2">
                        <label class="text-[10px] font-bold text-neutral-500 uppercase tracking-[0.2em] ml-1">Price (PKR)</label>
                        <div class="relative">
                            <span class="absolute left-5 top-1/2 -translate-y-1/2 text-red-600 font-bold text-sm">Rs.</span>
                            <input type="number" name="price" step="0.01" value="{{ product.price }}" required
                                class="w-full bg-neutral-800/50 border border-neutral-700/50 rounded-2xl py-4 pl-12 pr-6 text-white focus:ring-2 focus:ring-red-500/50 outline-none transition-all">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-neutral-500 uppercase tracking-[0.2em] ml-1">Service Category</label>
                        <select name="type" required
                            class="w-full bg-neutral-800/50 border border-neutral-700/50 rounded-2xl py-4 px-6 text-white focus:ring-2 focus:ring-red-500/50 outline-none appearance-none cursor-pointer">
                            <option value="IN" {% if product.type == 'IN' %}selected{% endif %}>INTERIOR</option>
                            <option value="EX" {% if product.type == 'EX' %}selected{% endif %}>EXTERIOR</option>
                            <option value="MCH" {% if product.type == 'MCH' %}selected{% endif %}>MECHANICAL</option>
                            <option value="RM" {% if product.type == 'RM' %}selected{% endif %}>RIMS</option>
                            <option value="WRP" {% if product.type == 'WRP' %}selected{% endif %}>WRAPS</option>
                            <option value="LED" {% if product.type == 'LED' %}selected{% endif %}>LED LIGHTS</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-neutral-500 uppercase tracking-[0.2em] ml-1">Warranty Details</label>
                        <input type="text" name="warranty" value="{{ product.warranty }}"
                            class="w-full bg-neutral-800/50 border border-neutral-700/50 rounded-2xl py-4 px-6 text-white focus:ring-2 focus:ring-red-500/50 outline-none transition-all">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-neutral-500 uppercase tracking-[0.2em] ml-1">Technical Specifications</label>
                    <textarea name="details" rows="5" required
                        class="w-full bg-neutral-800/50 border border-neutral-700/50 rounded-2xl py-4 px-6 text-white focus:ring-2 focus:ring-red-500/50 outline-none transition-all resize-none">{{ product.details }}</textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-8 items-end">
                    <div class="md:col-span-1 space-y-2">
                        <label class="text-[10px] font-bold text-neutral-500 uppercase tracking-[0.2em]">Current Photo</label>
                        <div class="h-32 w-full rounded-2xl border border-neutral-800 bg-neutral-900 flex items-center justify-center overflow-hidden">
                            {% if product.photo %}
                                <img src="{{ product.photo.url }}" class="object-cover h-full w-full opacity-60">
                            {% else %}
                                <span class="text-neutral-700 text-[10px]">NO ASSET</span>
                            {% endif %}
                        </div>
                    </div>
                    <div class="md:col-span-3 space-y-2">
                        <label class="text-[10px] font-bold text-neutral-500 uppercase tracking-[0.2em]">Replace Image (Optional)</label>
                        <input type="file" name="photo" 
                            class="w-full text-sm text-neutral-500 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-neutral-800 file:text-white hover:file:bg-red-600 transition-all cursor-pointer">
                    </div>
                </div>

                <div class="pt-6 flex flex-col sm:flex-row gap-6">
                    <a href="{% url 'admin_dashboard' %}" 
                        class="flex-1 text-center rounded-2xl bg-neutral-800 py-5 font-black text-white uppercase tracking-widest hover:bg-neutral-700 transition-all active:scale-[0.98] border border-neutral-700">
                        Abort Updates
                    </a>
                    <button type="submit" 
                        class="flex-1 rounded-2xl bg-red-600 py-5 font-black text-white uppercase tracking-widest shadow-[0_0_20px_rgba(220,38,38,0.3)] hover:shadow-[0_0_35px_rgba(220,38,38,0.5)] transition-all duration-300 active:scale-[0.98]">
                        Commit Updates
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
