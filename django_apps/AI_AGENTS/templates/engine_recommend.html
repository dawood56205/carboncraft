{% extends "base1.html" %}
{% load static %}
{% block content %}
<section class="bg-[#050505] min-h-screen py-24 px-4 relative flex flex-col justify-center items-center font-sans">
    <a href="{% url 'ai_agents' %}" class="fixed top-8 left-6 md:left-12 z-50 flex items-center gap-4 text-gray-500 hover:text-blue-400 transition-all group">
        <div class="w-12 h-12 rounded-full border border-white/5 bg-[#0a0a0a] flex items-center justify-center group-hover:border-blue-500/50 group-hover:bg-blue-900/20 group-hover:shadow-[0_0_20px_rgba(37,99,235,0.2)] transition-all duration-500">
            <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </div>
        <span class="text-[10px] uppercase tracking-[0.2em] font-bold opacity-0 -translate-x-4 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-500">AI AGENTS</span>
    </a>
    <div class="max-w-3xl w-full mx-auto relative z-10">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-light tracking-tight text-white uppercase">Engine Recommendation <span class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-blue-600">Protocol</span></h1>
            <p class="text-sm text-gray-400 mt-4">Enter a car model and budget to receive tailored engine options with bolt‑on and alteration suggestions.</p>
        </div>
        <div class="bg-[#0a0a0a] border border-white/5 p-8 md:p-12 shadow-2xl relative">
            <form method="POST" action="#result" class="space-y-8">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Car Model</label>
                        <input type="text" name="car_model" placeholder="e.g. Toyota Corolla 2021" class="w-full bg-[#0d0d0d] border border-white/10 px-4 py-3 text-white placeholder-gray-600 focus:border-blue-600 focus:bg-[#111] outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Budget (PKR)</label>
                        <input type="number" name="budget" placeholder="e.g. 300000" class="w-full bg-[#0d0d0d] border border-white/10 px-4 py-3 text-white placeholder-gray-600 focus:border-blue-600 focus:bg-[#111] outline-none" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-white text-black hover:bg-blue-600 hover:text-white font-bold py-4 px-6 uppercase tracking-[0.2em] transition-colors flex items-center justify-center gap-2">
                    Generate Recommendations
                </button>
            </form>
            {% if result %}
            <div id="result" class="mt-12 pt-6 border-t border-white/5">
                <div class="text-blue-100/80 leading-relaxed text-sm space-y-4" >
                    {{ result|safe }}
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</section>
{% endblock %}
