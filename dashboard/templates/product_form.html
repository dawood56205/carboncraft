{% extends "base1.html" %}

{% block content %}
<div class="min-h-screen bg-[#0a0a0a] py-6 px-4 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-neutral-900 via-[#0a0a0a] to-[#0a0a0a]">
    <div class="max-w-4xl mx-auto">
        
        <div class="mb-4">
            <a href="{% url 'admin_dashboard' %}" class="inline-flex items-center text-[10px] font-bold text-neutral-500 hover:text-red-500 uppercase tracking-widest transition-colors">
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Dashboard
            </a>
        </div>

        <div class="bg-neutral-900/50 backdrop-blur-xl rounded-2xl shadow-2xl border border-neutral-800 overflow-hidden">
            
            <div class="relative h-20 bg-red-600 overflow-hidden">
                <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-neutral-900 to-transparent"></div>
                <div class="absolute bottom-3 left-6">
                    <h2 class="text-xl font-black text-white tracking-tighter uppercase">Inventory Entry</h2>
                </div>
            </div>

            <form action="" method="POST" enctype="multipart/form-data" class="p-6 space-y-4">
                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="md:col-span-2 space-y-1">
                        <label class="text-[9px] font-bold text-neutral-500 uppercase tracking-widest ml-1">Product</label>
                        <input type="text" name="product" required
                            class="w-full bg-neutral-800/40 border border-neutral-700/50 rounded-xl py-2 px-4 text-sm text-white focus:ring-1 focus:ring-red-500/50 outline-none transition-all"
                            placeholder="Product Name">
                    </div>

                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-neutral-500 uppercase tracking-widest ml-1">Price (PKR)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500 text-xs font-mono">Rs.</span>
                            <input type="number" name="price" step="0.01" required
                                class="w-full bg-neutral-800/40 border border-neutral-700/50 rounded-xl py-2 pl-10 pr-4 text-sm text-white focus:ring-1 focus:ring-red-500/50 outline-none transition-all"
                                placeholder="0.00">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="space-y-1 relative">
                    <label class="text-[9px] font-bold text-neutral-500 uppercase tracking-widest ml-1">Category</label>
                    <div class="relative">
                        <select name="type" required
                            class="w-full bg-neutral-800/40 border border-neutral-700/50 rounded-xl py-2 px-4 text-sm text-white focus:ring-1 focus:ring-red-500/50 outline-none appearance-none cursor-pointer">
                            <option value="IN" class="bg-neutral-900">INTERIOR</option>
                            <option value="EX" class="bg-neutral-900">EXTERIOR</option>
                            <option value="MCH" class="bg-neutral-900">MECHANICAL</option>
                            <option value="RM" class="bg-neutral-900">RIMS</option>
                            <option value="SPI" class="bg-neutral-900">SPOILER</option>
                            <option value="WRP" class="bg-neutral-900">WRAPS</option>
                            <option value="LED" class="bg-neutral-900">LED LIGHTS</option>
                            <option value="ACS" class="bg-neutral-900">ACCESSORIES</option>
                            <option value="TR" class="bg-neutral-900">TYRES</option>
                        </select>
                        
                        <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                            <svg class="w-3 h-3 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>
                </div>

                    <div class="space-y-1">
                        <label class="text-[9px] font-bold text-neutral-500 uppercase tracking-widest ml-1">Warranty</label>
                        <input type="text" name="warranty"
                            class="w-full bg-neutral-800/40 border border-neutral-700/50 rounded-xl py-2 px-4 text-sm text-white focus:ring-1 focus:ring-red-500/50 outline-none transition-all"
                            placeholder="Duration">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[9px] font-bold text-neutral-500 uppercase tracking-widest ml-1">Specifications</label>
                    <textarea name="details" rows="3" required
                        class="w-full bg-neutral-800/40 border border-neutral-700/50 rounded-xl py-2 px-4 text-sm text-white focus:ring-1 focus:ring-red-500/50 outline-none transition-all resize-none"
                        placeholder="Technical details..."></textarea>
                </div>

                <div class="space-y-1">
                    <label class="text-[9px] font-bold text-neutral-500 uppercase tracking-widest ml-1">Asset Upload</label>
                    <div class="relative group h-16">
                        <div class="absolute inset-0 bg-neutral-800/20 border border-dashed border-neutral-700 rounded-xl group-hover:border-red-500/50 transition-colors"></div>
                        <input type="file" name="photo" class="relative z-10 w-full h-full opacity-0 cursor-pointer">
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none gap-3">
                            <svg class="w-5 h-5 text-neutral-500 group-hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-width="1.5"/></svg>
                            <p class="text-xs text-neutral-500">Upload Image Asset</p>
                        </div>
                    </div>
                </div>

                <div class="pt-2 flex flex-col sm:flex-row gap-4">
                    <a href="{% url 'admin_dashboard' %}" 
                        class="flex-1 text-center rounded-xl bg-neutral-800 py-3 text-xs font-black text-white uppercase tracking-widest hover:bg-neutral-700 transition-all active:scale-[0.99] border border-neutral-700">
                        Cancel Entry
                    </a>
                    <button type="submit" 
                        class="flex-1 rounded-xl bg-red-600 py-3 text-xs font-black text-white uppercase tracking-widest hover:bg-red-500 transition-all active:scale-[0.99] shadow-[0_0_15px_rgba(220,38,38,0.2)]">
                        Commit to Inventory
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
